<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Luke Richardson Career Path</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Base world: a robot cell at night (graphite + safety amber). Each stop swaps in its organization's colours; registered properties let them cross-fade. */
  @property --bg { syntax: "<color>"; inherits: true; initial-value: #000; }
  @property --panel { syntax: "<color>"; inherits: true; initial-value: #000; }
  @property --line { syntax: "<color>"; inherits: true; initial-value: #000; }
  @property --text { syntax: "<color>"; inherits: true; initial-value: #000; }
  @property --body { syntax: "<color>"; inherits: true; initial-value: #000; }
  @property --muted { syntax: "<color>"; inherits: true; initial-value: #000; }
  @property --accent { syntax: "<color>"; inherits: true; initial-value: #000; }
  @property --accent-text { syntax: "<color>"; inherits: true; initial-value: #000; }
  @property --on-accent { syntax: "<color>"; inherits: true; initial-value: #000; }
  @property --eyebrow { syntax: "<color>"; inherits: true; initial-value: #000; }
  :root {
    color-scheme: dark;
    --bg: #111418;
    --panel: #181C22;
    --panel-2: #1F242C;
    --line: #2C333D;
    --accent: #F2B33D;
    --accent-text: #F2B33D;
    --on-accent: #111418;
    --eyebrow: #86A8BE;
    --text: #F0F2F4;
    --body: #C3C9D0;
    --muted: #8A929C;
    --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
    --sans: "Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }
  html, body { height: 100%; background: var(--bg); color: var(--body); }
  html { transition: --bg .9s ease, --panel .9s ease, --line .9s ease, --text .9s ease, --body .9s ease, --muted .9s ease, --accent .9s ease, --accent-text .9s ease, --on-accent .9s ease, --eyebrow .9s ease; }
  body { font-family: var(--sans); font-size: 16px; line-height: 1.5; padding-inline: 16px; }
  .app { max-width: 1280px; height: 100%; margin: 0 auto; padding-block: 18px; display: grid; grid-template-rows: auto minmax(260px, 1fr) auto auto auto; gap: 14px; }

  /* Header */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .who { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .who strong { font-family: var(--display); font-weight: 800; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; color: var(--text); }
  .who span { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .04em; }
  .top-right { display: flex; align-items: center; gap: 14px; }
  .count { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .count b { color: var(--accent-text); font-weight: 500; }
  .fs { font-family: var(--mono); font-size: 12px; color: var(--body); background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 6px 10px; cursor: pointer; }
  .fs:hover { border-color: var(--accent); color: var(--accent); }
  .fs:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* Carousel */
  /* Backdrop: a faint line drawing per stop, fixed to the viewport so it stays put if the page scrolls */
  .backdrop { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; color: #000; }
  .bd-layer { position: absolute; inset: 0; opacity: 0; transition: opacity .9s ease; }
  .bd-layer.on { opacity: 1; }
  .bd-layer svg { position: absolute; left: 2%; bottom: 0; height: 94%; width: auto; max-width: 60%; opacity: .35; }
  .app { position: relative; z-index: 1; }
  .stage { -webkit-mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); mask-image: linear-gradient(90deg, transparent, #000 10%, #000 90%, transparent); }
  .stage { position: relative; min-height: 0; overflow: hidden; perspective: var(--persp, 700px); touch-action: pan-y; cursor: grab; user-select: none; -webkit-user-select: none; }
  .stage.dragging { cursor: grabbing; }
  .ring { position: absolute; inset: 0; z-index: 1; transform-style: preserve-3d; }
  .card { position: absolute; left: 50%; top: 50%; width: var(--card-w, 170px); aspect-ratio: 2 / 3; padding: 0; border: 0; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; transform-style: preserve-3d; backface-visibility: hidden; will-change: transform; }
  /* Focus is shown on the card face itself and always follows the current stop, so no ring is left behind */
  .card:focus { outline: none; }
  .card:focus-visible .face { box-shadow: 0 0 0 3px var(--accent), 0 22px 50px rgba(0,0,0,.4); }
  .face { position: absolute; inset: 0; border-radius: 4px; overflow: hidden; background: var(--c1, #22303C); box-shadow: inset 0 0 0 1px rgba(128,128,128,.28), 0 18px 40px rgba(0,0,0,.35); }
  .face img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
  /* Photo placeholder: tinted panel, big monogram, dashed photo frame */
  .ph { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 9% 9% 10%; background: linear-gradient(160deg, var(--c1) 0%, var(--c2) 100%); }
  .ph::before { content: ""; position: absolute; inset: 6%; border: 1.5px dashed rgba(255,255,255,.22); border-radius: 3px; pointer-events: none; }
  .ph .pt { font-family: var(--mono); font-size: calc(var(--card-w) * .062); letter-spacing: .08em; color: rgba(255,255,255,.7); position: relative; }
  .ph .mono { font-family: var(--display); font-weight: 800; font-size: calc(var(--card-w) * .42); line-height: .9; color: rgba(255,255,255,.92); position: relative; letter-spacing: .01em; }
  .ph .org { font-family: var(--display); font-weight: 600; font-size: calc(var(--card-w) * .1); line-height: 1.05; color: #fff; text-transform: uppercase; letter-spacing: .03em; position: relative; }
  .ph .add { font-family: var(--mono); font-size: calc(var(--card-w) * .05); color: rgba(255,255,255,.55); position: relative; margin-top: 4px; }
  /* Logo card: the organization's mark on its own plate, until photos replace it */
  .lc { position: absolute; inset: 0; display: grid; grid-template-rows: auto 1fr auto; background: var(--plate); color: var(--plate-ink); padding: 9% 9% 10%; }
  .lc .pt { font-family: var(--mono); font-size: calc(var(--card-w) * .062); letter-spacing: .08em; opacity: .65; }
  .lc .logo { position: relative; min-height: 0; overflow: hidden; }
  /* absolutely filled so the logo can never grow past its row and run under the name */
  .lc .logo img { position: absolute; inset: 8% 4%; width: 92%; height: 84%; object-fit: contain; pointer-events: none; }
  .lc .org { font-family: var(--display); font-weight: 600; font-size: calc(var(--card-w) * .1); line-height: 1.05; text-transform: uppercase; letter-spacing: .03em; }
  .lc .yr { font-family: var(--mono); font-size: calc(var(--card-w) * .05); opacity: .6; margin-top: 3px; }
  .card.active .face { box-shadow: 0 0 0 2px var(--accent), 0 22px 50px rgba(0,0,0,.4); }

  /* Waypoint path (the robot-program view of the career) */
  .path { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: 14px; }
  .arrow { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--text); font-size: 18px; cursor: pointer; display: grid; place-items: center; transition: border-color .2s, color .2s, opacity .2s; }
  .arrow:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .arrow:disabled { opacity: .3; cursor: default; }
  .arrow:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  /* Waypoints ride under their cards: positions are projected from the same cylinder each frame */
  .steps { position: relative; height: 64px; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent); mask-image: linear-gradient(90deg, transparent, #000 9%, #000 91%, transparent); }
  .steps::before { content: ""; position: absolute; left: 0; right: 0; top: 11px; height: 2px; background: var(--line); }
  .steps .fill { position: absolute; left: 0; top: 11px; height: 2px; background: var(--accent); width: 0; }
  .step { position: absolute; top: 0; left: 0; width: 150px; margin-left: -75px; will-change: transform; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 0 4px; border: 0; background: none; color: var(--muted); font: inherit; cursor: pointer; }
  .step .node { width: 24px; height: 24px; border-radius: 50%; background: var(--bg); border: 2px solid var(--line); display: grid; place-items: center; font-family: var(--mono); font-size: 10px; color: var(--muted); transition: border-color .3s, background .3s, color .3s; position: relative; z-index: 1; }
  .step .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .04em; text-align: center; line-height: 1.3; max-width: 16ch; }
  .step.done .node { border-color: var(--accent); color: var(--accent-text); }
  .step[aria-current="true"] .node { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .step[aria-current="true"] .lbl { color: var(--text); }
  .step:hover .lbl { color: var(--text); }
  .step:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* Info panel */
  .info { position: relative; overflow: hidden; min-height: 300px; }
  .panel { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px 48px; align-items: start; }
  .panel.anim-in { animation: slideIn .55s cubic-bezier(.2,.7,.2,1) both; }
  .panel.anim-out { position: absolute; inset: 0 0 auto 0; animation: slideOut .4s cubic-bezier(.5,0,.8,.4) both; }
  @keyframes slideIn { from { opacity: 0; transform: translateX(calc(var(--dir, 1) * 60px)); } to { opacity: 1; transform: none; } }
  @keyframes slideOut { to { opacity: 0; transform: translateX(calc(var(--dir, 1) * -60px)); } }
  .eyebrow { font-family: var(--mono); font-size: 12px; color: var(--eyebrow); letter-spacing: .06em; margin-bottom: 6px; }
  .panel h1 { font-family: var(--display); font-weight: 800; font-size: clamp(36px, 5vw, 64px); line-height: .95; text-transform: uppercase; letter-spacing: .01em; color: var(--text); margin: 0 0 8px; text-wrap: balance; }
  .role { font-size: 19px; font-weight: 500; color: var(--accent-text); margin: 0; }
  .meta { font-family: var(--mono); font-size: 12.5px; color: var(--muted); margin-top: 6px; }
  .fav { margin-top: 18px; display: flex; flex-direction: column; gap: 4px; max-width: 46ch; }
  .fav-k { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--eyebrow); }
  .fav-v { font-size: 17px; font-weight: 500; color: var(--text); line-height: 1.35; }
  .right { display: flex; flex-direction: column; gap: 14px; }
  .right p { margin: 0; max-width: 64ch; font-size: 16.5px; }
  .lesson { border-left: 0; background: var(--panel); border-radius: 4px; padding: 12px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; }
  .lesson dt { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--eyebrow); grid-column: 1 / -1; }
  .lesson dd { margin: 0; color: var(--text); grid-column: 1 / -1; font-size: 16px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-family: var(--mono); font-size: 11.5px; color: var(--body); border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; }
  .todo { color: var(--muted); font-style: italic; }
  .advice { margin: 0; padding: 0; list-style: none; counter-reset: adv; display: flex; flex-direction: column; gap: 10px; max-width: 64ch; }
  .advice li { counter-increment: adv; display: grid; grid-template-columns: 26px minmax(0, 1fr); gap: 10px; font-size: 16px; line-height: 1.45; color: var(--body); }
  .advice li::before { content: counter(adv); font-family: var(--mono); font-size: 12px; font-weight: 500; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); margin-top: 1px; }


  .chip-media {
    font-family: var(--mono); font-size: 11.5px; color: var(--on-accent);
    background: var(--accent); border: 1px solid var(--accent); border-radius: 999px;
    padding: 3px 12px; cursor: pointer; letter-spacing: .04em;
  }
  .chip-media:hover { filter: brightness(1.08); }
  .chip-media:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }

  .viewer {
    position: fixed; inset: 0; z-index: 40; display: none;
    flex-direction: column; background: var(--bg); color: var(--text);
    padding: 18px 20px 16px; box-sizing: border-box;
  }
  .viewer.open { display: flex; }
  .viewer-top {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    flex-wrap: wrap; margin-bottom: 12px;
  }
  .viewer-top .label { font-family: var(--mono); font-size: 12px; color: var(--eyebrow); letter-spacing: .08em; text-transform: uppercase; }
  .viewer-top .cap { font-family: var(--sans); font-size: 15px; color: var(--text); font-weight: 500; }
  .viewer-close {
    font-family: var(--mono); font-size: 12px; color: var(--body);
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 6px 12px; cursor: pointer;
  }
  .viewer-close:hover { border-color: var(--accent); color: var(--accent); }
  .viewer-stage {
    flex: 1; min-height: 0; display: grid; place-items: center;
    background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
    overflow: hidden; position: relative;
  }
  .viewer-stage iframe, .viewer-stage video, .viewer-stage img {
    width: min(100%, 1100px); height: min(100%, 70vh); max-height: 100%;
    border: 0; background: #000; object-fit: contain;
  }
  .viewer-stage iframe { aspect-ratio: 16 / 9; height: auto; max-height: min(70vh, 100%); width: min(100%, calc(min(70vh, 100%) * 16 / 9)); }
  .viewer-nav {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin-top: 12px; font-family: var(--mono); font-size: 12px; color: var(--muted);
  }
  .viewer-nav button {
    font-family: var(--mono); font-size: 12px; color: var(--text);
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    padding: 6px 12px; cursor: pointer;
  }
  .viewer-nav button:disabled { opacity: .35; cursor: default; }
  .viewer-nav button:not(:disabled):hover { border-color: var(--accent); color: var(--accent); }
  .hint { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: center; }
  kbd { font-family: var(--mono); font-size: 10.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 5px; color: var(--body); }

  @media (max-width: 760px) {
    .bd-layer svg { left: -10%; max-width: 90%; height: 70%; }
    html, body { height: auto; }
    .app { height: auto; grid-template-rows: auto 360px auto auto auto; }
    .panel { grid-template-columns: 1fr; }
    .info { min-height: 440px; }
    .step .lbl { display: none; }
    .fs { display: none; }
  }
  @media (max-height: 760px) and (min-width: 761px) {
    .panel h1 { font-size: clamp(30px, 4vw, 48px); }
    .right p { font-size: 15px; }
    .info { min-height: 290px; }
    .fav { margin-top: 12px; }
    .fav-v { font-size: 15.5px; }
    .advice li { font-size: 15px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .bd-layer { transition: none; }
    html { transition: none; }
    .panel.anim-in, .panel.anim-out { animation: none; }
    .panel.anim-out { display: none; }
  }
</style>

<div class="backdrop" aria-hidden="true"><div class="bd-layer" id="bdA"></div><div class="bd-layer" id="bdB"></div></div>
<main class="app">
  <header class="top">
    <div class="who"><strong>Luke Richardson</strong><span>15 years in robotics and technical training, from the Peace Corps to AI vision</span></div>
    <div class="top-right">
      <span class="count" id="count"></span>
      <button class="fs" id="fs" type="button">Full screen</button>
    </div>
  </header>

  <section class="stage" id="stage" aria-label="Career stops">
    <div class="ring" id="ring"></div>
  </section>

  <nav class="path" aria-label="Career path">
    <button class="arrow" id="prev" type="button" aria-label="Previous stop">&#8592;</button>
    <div class="steps" id="steps"><span class="fill" id="fill"></span></div>
    <button class="arrow" id="next" type="button" aria-label="Next stop">&#8594;</button>
  </nav>

  <section class="info" id="info" aria-live="polite"></section>

  <div class="hint">Use <kbd>&#8592;</kbd> <kbd>&#8594;</kbd> or a clicker; <kbd>&#8595;</kbd> opens Media when available</div>
</main>


<div class="viewer" id="viewer" role="dialog" aria-modal="true" aria-label="Stop media" hidden>
  <div class="viewer-top">
    <div>
      <div class="label" id="viewer-label">Media</div>
      <div class="cap" id="viewer-caption"></div>
    </div>
    <button type="button" class="viewer-close" id="viewer-close">Close · Esc</button>
  </div>
  <div class="viewer-stage" id="viewer-stage"></div>
  <div class="viewer-nav">
    <button type="button" id="viewer-prev" aria-label="Previous media">← Prev</button>
    <span id="viewer-count"></span>
    <button type="button" id="viewer-next" aria-label="Next media">Next →</button>
  </div>
</div>

<script>
/* =====================================================================
   EDIT YOUR CAREER HERE. One object per stop, in chronological order.
   - Anything in [square brackets] is a placeholder to replace.
   - photo: leave '' for the placeholder card, or paste an image URL /
     data: URI later. Portrait (2:3) photos look best.
   - mark: 1–3 letters shown big on the placeholder card.
   - c1 / c2: the placeholder card's two gradient colours.
   ===================================================================== */

const N = STOPS.length;
const $ = id => document.getElementById(id);
const stage = $('stage'), ring = $('ring'), info = $('info'), stepsEl = $('steps'), fill = $('fill'), countEl = $('count');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ph = s => esc(s).replace(/\[([^\]]+)\]/g, '<span class="todo">[$1]</span>');

// ---------- build cards ----------
let dragMoved = false;
const cards = STOPS.map((s, i) => {
  const b = document.createElement('button');
  b.className = 'card'; b.type = 'button';
  b.setAttribute('aria-label', `${s.org}, ${s.role}`);
  b.innerHTML = `<div class="face" style="--c1:${s.c1};--c2:${s.c2}">${
    s.photo ? `<img src="${esc(s.photo)}" alt="" draggable="false">`
    : s.logo ? `<div class="lc" style="--plate:${s.plate};--plate-ink:${s.plateInk}"><span class="pt">P[${i + 1}] · ${esc(s.kind)}</span><span class="logo"><img src="${LOGOS[s.logo]}" alt="" draggable="false"></span><span><span class="org">${esc(s.org)}</span><br><span class="yr">${esc(s.years)}</span></span></div>`
            : `<div class="ph"><span class="pt">P[${i + 1}] · ${esc(s.kind)}</span><span class="mono">${esc(s.mark)}</span><span><span class="org">${esc(s.org)}</span><br><span class="add">photo goes here</span></span></div>`
  }</div>`;
  b.addEventListener('click', e => { if (dragMoved) { e.preventDefault(); return; } go(i); });
  ring.appendChild(b); return b;
});

// ---------- waypoint path ----------
const steps = STOPS.map((s, i) => {
  const b = document.createElement('button');
  b.className = 'step'; b.type = 'button';
  b.setAttribute('aria-label', `Stop ${i + 1}: ${s.org}`);
  b.innerHTML = `<span class="node">${i + 1}</span><span class="lbl">${ph(s.short)}</span>`;
  b.addEventListener('click', () => go(i));
  stepsEl.appendChild(b); return b;
});

// ---------- geometry: cards on the inside of a cylinder ----------
let cardW = 170, R = 750, step = .25;
let stepOrigin = 0;
// screen x of a card d slots from the centre, using the stage's own perspective
function project(d) {
  const th = d * step, P = R * 1.18;
  return R * Math.sin(th) * P / (P - R * (1 - Math.cos(th)));
}
function measure() {
  const w = stage.clientWidth, h = stage.clientHeight;
  cardW = Math.max(110, Math.min(230, w * (w < 760 ? .32 : .14), (h / 1.5) / 1.15));
  R = cardW * 5.6;
  step = (cardW * 1.12) / R;
  stage.style.setProperty('--card-w', cardW + 'px');
  ring.style.setProperty('--card-w', cardW + 'px');
  stage.style.setProperty('--persp', (R * 1.18) + 'px');
  const sr = stage.getBoundingClientRect(), pr = stepsEl.getBoundingClientRect();
  stepOrigin = sr.left + sr.width / 2 - pr.left;
  render();
}

// pos = continuous index at the centre. The path has a start and an end, so it doesn't loop.
let pos = 0, aFrom = 0, aTo = 0, aStart = 0, aDur = 0, raf = 0;
function render() {
  cards.forEach((c, i) => {
    const d = i - pos, ad = Math.abs(d);
    const a = -d * step;
    const op = ad > 3.2 ? Math.max(0, 1 - (ad - 3.2) / .5) : 1;
    c.style.transform = `translate(-50%, -50%) translateZ(${R}px) rotateY(${a}rad) translateZ(${-R}px)`;
    c.style.opacity = op;
    c.style.visibility = op <= 0 ? 'hidden' : 'visible';
    c.style.zIndex = String(100 - Math.round(ad * 10));
    c.style.filter = `brightness(${1 - Math.min(ad, 3) * .13})`;
    c.tabIndex = ad < .5 ? 0 : -1;
    steps[i].style.transform = `translateX(${(stepOrigin + project(d)).toFixed(1)}px)`;
    steps[i].style.opacity = op;
  });
  // amber fill runs from the first stop to the centre (the current position)
  const left = Math.max(0, stepOrigin + project(-pos));
  fill.style.left = left + 'px';
  fill.style.width = Math.max(0, stepOrigin - left) + 'px';
}
const ease = t => 1 - Math.pow(1 - t, 3);
function tick(now) {
  const t = Math.min(1, (now - aStart) / aDur);
  pos = aFrom + (aTo - aFrom) * ease(t); render();
  if (t < 1) raf = requestAnimationFrame(tick); else { pos = aTo; raf = 0; }
}
function animateTo(target) {
  cancelAnimationFrame(raf);
  aFrom = pos; aTo = target;
  const dist = Math.abs(target - pos);
  if (reduce || dist < .001) { pos = target; render(); return; }
  aDur = 560 + 160 * Math.min(dist, 4);
  aStart = performance.now(); raf = requestAnimationFrame(tick);
}

// ---------- state ----------
let active = -1;
function go(i) {
  i = Math.max(0, Math.min(N - 1, i));
  animateTo(i);
  if (i !== active) setActive(i, i > active ? 1 : -1);
}
function setActive(i, dir) {
  if (mediaOpen) closeViewer();
  const first = active === -1; active = i;
  const s = STOPS[i];
  const th = THEMES[s.theme] || THEMES.base, root = document.documentElement;
  Object.entries(th).forEach(([k, v]) => k === 'scheme' ? (root.style.colorScheme = v) : root.style.setProperty('--' + k, v));
  setBackdrop(s.theme);
  countEl.innerHTML = `<b>P[${i + 1}]</b> / P[${N}]`;
  cards.forEach((c, j) => c.classList.toggle('active', j === i));
  // if a card had focus (e.g. it was clicked), hand focus to the new current card
  if (document.activeElement && document.activeElement.classList.contains('card')) cards[i].focus({ preventScroll: true });
  steps.forEach((st, j) => { st.setAttribute('aria-current', j === i); st.classList.toggle('done', j < i); });
  $('prev').disabled = i === 0; $('next').disabled = i === N - 1;

  const panel = document.createElement('div');
  panel.className = 'panel';
  panel.innerHTML = `
    <div>
      <div class="eyebrow">${ph(s.years)} · ${esc(s.kind)}</div>
      <h1>${ph(s.heading || s.org)}</h1>
      <p class="role">${ph(s.role)}</p>
      <div class="meta">${ph(s.place)}</div>
      ${s.project ? `<div class="fav"><span class="fav-k">Favorite project</span><span class="fav-v">${ph(s.project)}</span></div>` : ''}
    </div>
    <div class="right">
      ${Array.isArray(s.did) ? `<ol class="advice">${s.did.map(t => `<li>${ph(t)}</li>`).join('')}</ol>` : `<p>${ph(s.did)}</p>`}
      <dl class="lesson"><dt>What it taught me</dt><dd>${ph(s.lesson)}</dd></dl>
      <div class="chips">${s.skills.map(k => `<span class="chip">${ph(k)}</span>`).join('')}${s.media && s.media.length ? `<button type="button" class="chip-media" data-open-media>Media</button>` : ''}</div>
    </div>`;
  info.style.setProperty('--dir', dir);
  info.querySelectorAll('.panel.anim-out').forEach(p => p.remove());
  const old = info.querySelector('.panel');
  if (old && !first) {
    old.classList.add('anim-out');
    old.addEventListener('animationend', () => old.remove(), { once: true });
    if (reduce) old.remove();
    panel.classList.add('anim-in');
  }
  info.appendChild(panel);
  panel.querySelectorAll('[data-open-media]').forEach(btn => btn.addEventListener('click', () => openViewer(0)));
  requestAnimationFrame(measure);
}

// ---------- backdrop cross-fade ----------
let bdKey = null, bdFront = $('bdA'), bdBack = $('bdB');
function setBackdrop(key) {
  if (key === bdKey) return;
  bdKey = key;
  bdBack.innerHTML = BACKDROPS[key] || '';
  bdBack.classList.add('on'); bdFront.classList.remove('on');
  [bdFront, bdBack] = [bdBack, bdFront];
}


// ---------- media viewer ----------
let mediaOpen = false, mediaIdx = 0;
const viewer = $('viewer'), viewerStage = $('viewer-stage'), viewerCap = $('viewer-caption');
const viewerCount = $('viewer-count'), viewerPrev = $('viewer-prev'), viewerNext = $('viewer-next');

function currentMedia() {
  const s = STOPS[active];
  return (s && s.media) || [];
}
function renderViewerItem() {
  const items = currentMedia();
  const item = items[mediaIdx];
  if (!item) return;
  viewerCap.textContent = item.caption || '';
  viewerCount.textContent = items.length > 1 ? `${mediaIdx + 1} / ${items.length}` : '';
  viewerPrev.disabled = mediaIdx <= 0;
  viewerNext.disabled = mediaIdx >= items.length - 1;
  $('viewer-label').textContent = STOPS[active].org + ' · Media';
  // tear down previous media (pause video / clear iframe)
  viewerStage.innerHTML = '';
  if (item.type === 'youtube') {
    const id = item.id || (item.src || '').replace(/^.*(?:v=|youtu\.be\/|embed\/)([^&?/]+).*$/, '$1');
    const iframe = document.createElement('iframe');
    iframe.src = `https://www.youtube.com/embed/${encodeURIComponent(id)}?autoplay=1&rel=0`;
    iframe.title = item.caption || 'YouTube video';
    iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share';
    iframe.allowFullscreen = true;
    viewerStage.appendChild(iframe);
  } else if (item.type === 'video') {
    const v = document.createElement('video');
    v.src = item.src; v.controls = true; v.playsInline = true; v.preload = 'metadata';
    if (item.poster) v.poster = item.poster;
    viewerStage.appendChild(v);
    v.play().catch(() => {});
  } else if (item.type === 'image') {
    const img = document.createElement('img');
    img.src = item.src; img.alt = item.caption || '';
    viewerStage.appendChild(img);
  }
}
function openViewer(i = 0) {
  const items = currentMedia();
  if (!items.length) return;
  mediaIdx = Math.max(0, Math.min(items.length - 1, i));
  mediaOpen = true;
  viewer.hidden = false;
  viewer.classList.add('open');
  renderViewerItem();
  $('viewer-close').focus({ preventScroll: true });
}
function closeViewer() {
  if (!mediaOpen) return;
  mediaOpen = false;
  viewer.classList.remove('open');
  viewer.hidden = true;
  viewerStage.innerHTML = '';
}
function stepViewer(delta) {
  const items = currentMedia();
  if (!items.length) return;
  mediaIdx = Math.max(0, Math.min(items.length - 1, mediaIdx + delta));
  renderViewerItem();
}
$('viewer-close').addEventListener('click', closeViewer);
viewerPrev.addEventListener('click', () => stepViewer(-1));
viewerNext.addEventListener('click', () => stepViewer(1));

// ---------- controls ----------
$('prev').addEventListener('click', () => go(active - 1));
$('next').addEventListener('click', () => go(active + 1));
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (mediaOpen) {
    if (e.key === 'Escape' || e.key === 'ArrowUp') { e.preventDefault(); closeViewer(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); stepViewer(-1); }
    else if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); stepViewer(1); }
    return;
  }
  const fwd = ['ArrowRight', 'PageDown', ' '], back = ['ArrowLeft', 'PageUp'];
  if (e.key === 'ArrowDown') {
    if (currentMedia().length) { e.preventDefault(); openViewer(0); }
    return;
  }
  if (fwd.includes(e.key)) { e.preventDefault(); go(active + 1); }
  else if (back.includes(e.key)) { e.preventDefault(); go(active - 1); }
  else if (e.key === 'Home') go(0);
  else if (e.key === 'End') go(N - 1);
});
$('fs').addEventListener('click', async () => {
  try {
    if (document.fullscreenElement) await document.exitFullscreen();
    else await document.documentElement.requestFullscreen();
  } catch (_) { $('fs').textContent = 'Full screen unavailable'; $('fs').disabled = true; }
});
document.addEventListener('fullscreenchange', () => { $('fs').textContent = document.fullscreenElement ? 'Exit full screen' : 'Full screen'; });

// drag / swipe, with resistance past either end
let dragging = false, dx0 = 0, p0 = 0;
stage.addEventListener('pointerdown', e => { dragging = true; dragMoved = false; dx0 = e.clientX; p0 = pos; cancelAnimationFrame(raf); raf = 0; });
addEventListener('pointermove', e => {
  if (!dragging) return;
  const dx = e.clientX - dx0;
  if (Math.abs(dx) > 6 && !dragMoved) { dragMoved = true; stage.classList.add('dragging'); }
  if (!dragMoved) return;
  let p = p0 - dx / (cardW * 1.25);
  if (p < 0) p = p * .3; if (p > N - 1) p = N - 1 + (p - N + 1) * .3;
  pos = p; render();
});
addEventListener('pointerup', e => {
  if (!dragging) return;
  dragging = false; stage.classList.remove('dragging');
  if (!dragMoved) return;
  const dx = e.clientX - dx0;
  const t = Math.max(0, Math.min(N - 1, Math.round(pos - Math.sign(dx) * .2)));
  animateTo(t);
  if (t !== active) setActive(t, t > active ? 1 : -1);
  setTimeout(() => { dragMoved = false; }, 0);
});

addEventListener('resize', measure);
measure();
setActive(0, 1);
</script>


</body>
</html>
